<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Hero Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Baloo+Tammudu+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="game-container"></div>

    <!-- Game over screen: shows score, funny video and restart button -->
    <div id="gameover" class="hidden" role="dialog" aria-label="Game over">
        <div class="panel">
            <h2>Oops! Game over</h2>
            <p class="result">Score <strong id="go-score">0</strong> &nbsp;|&nbsp; Best <strong id="go-best">0</strong></p>
            <p id="go-new" class="newbest hidden">New best score!</p>
            <div class="video-wrap"><video id="go-video" playsinline preload="auto" controls></video><button id="unmute-btn" type="button" class="hidden">🔊 Sound on</button></div>
            <button id="restart-btn" type="button">మనల్ని ఎవడ్రా ఆపేది</button>
        </div>
    </div>

    <script type="module" src="/game.js"></script>
</body>
</html>
